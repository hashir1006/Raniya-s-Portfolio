<svg width="900" height="1100" viewBox="0 0 900 1100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="torsoGrad" x1="450" y1="360" x2="450" y2="1100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E222A" />
      <stop offset="100%" stop-color="#0F1116" />
    </linearGradient>
    <linearGradient id="headGrad" x1="450" y1="100" x2="450" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#262A34" />
      <stop offset="100%" stop-color="#14161C" />
    </linearGradient>
    <linearGradient id="fadeBottom" x1="450" y1="950" x2="450" y2="1100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Torso Silhouette -->
  <path
    d="M120 1100 C160 780 240 620 340 520 C380 440 400 360 420 360 C460 420 480 440 520 520 C620 620 700 780 760 1100 Z"
    fill="url(#torsoGrad)"
  />

  <!-- Head & Hair Silhouette -->
  <ellipse cx="450" cy="260" rx="115" ry="160" fill="url(#headGrad)" />
  <path
    d="M335 250 C335 130 380 90 450 90 C520 90 565 130 565 250 C565 370 540 410 490 425 C450 435 410 425 335 340 Z"
    fill="url(#headGrad)"
  />

  <!-- Rim light highlights -->
  <path
    d="M360 140 C330 240 360 340 380 440 C340 520 240 620 160 780 C135 900 125 1020 120 1100"
    stroke="#DCE5F5"
    stroke-width="5"
    stroke-linecap="round"
    filter="url(#glow)"
  />
  <path
    d="M540 140 C570 240 540 360 520 520 C620 620 700 780 760 1100"
    stroke="#AEC2DC"
    stroke-width="4"
    stroke-linecap="round"
    filter="url(#glow)"
  />

  <!-- Minimalist Placeholder Badge -->
  <g transform="translate(230, 670)">
    <rect width="440" height="120" rx="8" fill="#12161C" fill-opacity="0.94" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1.5" />
    <!-- Camera/User outline icon -->
    <circle cx="220" cy="40" r="14" stroke="#FFFFFF" stroke-width="2" fill="none" opacity="0.8" />
    <path d="M200 66 C200 55 210 50 220 50 C230 50 240 55 240 66" stroke="#FFFFFF" stroke-width="2" fill="none" opacity="0.8" />
    <text x="220" y="88" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="14" letter-spacing="2">
      PORTRAIT PLACEHOLDER
    </text>
    <text x="220" y="106" text-anchor="middle" fill="#9BA5B4" font-family="system-ui, -apple-system, sans-serif" font-size="11">
      Add /public/raniya-portrait.png to replace
    </text>
  </g>

  <!-- Bottom seamless blend to pure black -->
  <rect x="0" y="950" width="900" height="150" fill="url(#fadeBottom)" />
</svg>
